<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurveyQL playground</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>SurveyQL <span>playground</span></h1>
      <div class="sources-panel">
        <div class="sources-head">
          <span>Sources <small>name · survey · responses — each row is a dataset variable; the first is the default</small></span>
          <button id="add-source" class="secondary" type="button">+ Add source</button>
          <button id="reload" type="button">Reload data</button>
        </div>
        <div id="sources"></div>
      </div>
    </header>
    <main>
      <section class="editor-pane">
        <div class="toolbar">
          <button id="run" title="Ctrl+Enter">Run</button>
          <label class="engine">
            Charts
            <select id="engine">
              <option value="apexcharts">ApexCharts</option>
              <option value="survey-analytics">survey-analytics</option>
            </select>
          </label>
          <span id="status" class="status"></span>
        </div>
        <textarea id="editor" spellcheck="false"></textarea>
        <details class="help">
          <summary>Language cheat sheet</summary>
          <pre></pre>
        </details>
      </section>
      <section class="output-pane">
        <div id="output"></div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
